<!-- templates/includes/filter_panel.html -->
<div class="filters-sidebar" id="filter-panel"
     data-price-max="{{ price_max|default:5000 }}"
     data-capacity-max="{{ capacity_max|default:200 }}">
    
    {% if types %}
    <div class="filter-group">
        <label>{{ type_label|default:"Тип" }}:</label>
        <select id="type-filter">
            <option value="">Все</option>
            {% for type in types %}
                <option value="{{ type.id }}">{{ type.name }}</option>
            {% endfor %}
        </select>
    </div>
    {% endif %}

    <div class="filter-group">
        <label>{{ price_label|default:"Цена" }} (₽):</label>
        <input type="range" id="price-filter" min="0" max="{{ price_max|default:5000 }}" value="{{ price_max|default:5000 }}">
        <span id="price-value">{{ price_max|default:5000 }} ₽</span>
    </div>

    <div class="filter-group">
        <label>{{ capacity_label|default:"Мощность" }}:</label>
        <input type="range" id="capacity-filter" min="0" max="{{ capacity_max|default:200 }}" value="{{ capacity_max|default:200 }}">
        <span id="capacity-value">{{ capacity_max|default:200 }}</span>
    </div>

    <div class="filter-actions">
        <button id="apply-filters" class="btn-primary">Применить</button>
        <button id="reset-filters" class="btn-secondary">Сбросить</button>
    </div>
</div>
